[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hugin"
version = "0.1.0"
description = "Shared library and conventions for the Hugin personal productivity stack."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Fendrich" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hugin-init = "hugin.init:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hugin = ["py.typed"]
